asyncapi: '2.6.0'
id: 'urn:cookiedoc:websocket:api'
defaultContentType: application/json
info:
  title: CookieDoc WebSocket-API
  version: '1.0.0'
  description: |
    AsyncAPI-spesifikasjon for CookieDoc sin WebSocket-protokoll for samskriving og cookie-teller.

    Dette dokumentet er skrevet fra klientens perspektiv:
    `publish` er meldinger klienten sender til serveren, og `subscribe` er meldinger klienten mottar fra serveren.

    Serveren grupperer og bruker i dag klientmeldinger for innsetting, sletting, markør og teller asynkront med en bevisst forsinkelse.
  license:
    name: UNLICENSED
tags:
  - name: websocket
    description: Toveis WebSocket-protokoll brukt av CookieDoc-klienter.
servers:
  local:
    url: localhost:3030
    protocol: ws
    description: Lokal utviklingsserver. Klienter kobler seg til på `ws://localhost:3030/ws`.
channels:
  /ws:
    description: Hovedendepunktet for toveis WebSocket-kommunikasjon brukt av editoren og cookie-telleren.
    bindings:
      ws:
        method: GET
        bindingVersion: '0.1.0'
    publish:
      summary: Klienten sender dokument-, markør-, teller- og synkroniseringsmeldinger til serveren.
      operationId: clientSendsMessage
      message:
        oneOf:
          - $ref: '#/components/messages/SyncRequestMessage'
          - $ref: '#/components/messages/InsertMessage'
          - $ref: '#/components/messages/DeleteMessage'
          - $ref: '#/components/messages/CursorUpdateMessage'
          - $ref: '#/components/messages/CounterUpdateMessage'
    subscribe:
      summary: Klienten mottar snapshots, tilstandsendringer fra andre brukere, eksterne redigeringer, tellerstatus og feil.
      operationId: clientReceivesMessage
      message:
        oneOf:
          - $ref: '#/components/messages/AssignPeerIdMessage'
          - $ref: '#/components/messages/SyncStateMessage'
          - $ref: '#/components/messages/RemoteInsertMessage'
          - $ref: '#/components/messages/RemoteDeleteMessage'
          - $ref: '#/components/messages/RemoteCursorMessage'
          - $ref: '#/components/messages/PeerLeftMessage'
          - $ref: '#/components/messages/CounterStateMessage'
          - $ref: '#/components/messages/ErrorMessage'
components:
  messages:
    SyncRequestMessage:
      messageId: syncRequest
      name: SyncRequestMessage
      title: Synkroniseringsforespørsel
      summary: Ber om siste snapshot av dokumentet og siste tilstand for cookie-telleren.
      payload:
        $ref: '#/components/schemas/SyncRequestPayload'
    InsertMessage:
      messageId: insert
      name: InsertMessage
      title: Lokal innsetting
      summary: Sender en lokal innsettingsoperasjon for tekst til serveren.
      payload:
        $ref: '#/components/schemas/InsertPayload'
    DeleteMessage:
      messageId: delete
      name: DeleteMessage
      title: Lokal sletting
      summary: Sender en lokal sletteoperasjon for tekst til serveren.
      payload:
        $ref: '#/components/schemas/DeletePayload'
    CursorUpdateMessage:
      messageId: cursorUpdate
      name: CursorUpdateMessage
      title: Markøroppdatering
      summary: Sender klientens nåværende markøranker og indeks.
      payload:
        $ref: '#/components/schemas/CursorUpdatePayload'
    CounterUpdateMessage:
      messageId: counterUpdate
      name: CounterUpdateMessage
      title: Oppdatering av cookie-teller
      summary: Sender klientens siste antall cookies til den delte telleren.
      payload:
        $ref: '#/components/schemas/CounterUpdatePayload'
    AssignPeerIdMessage:
      messageId: assignPeerId
      name: AssignPeerIdMessage
      title: Tildelt peer-id
      summary: Sendes av serveren når en klient kobler til.
      payload:
        $ref: '#/components/schemas/AssignPeerIdPayload'
    SyncStateMessage:
      messageId: syncState
      name: SyncStateMessage
      title: Fullt dokumentsnapshot
      summary: Sendes av serveren ved tilkobling og som svar på synkroniseringsforespørsler eller gjenoppretting.
      payload:
        $ref: '#/components/schemas/SyncStatePayload'
    RemoteInsertMessage:
      messageId: remoteInsert
      name: RemoteInsertMessage
      title: Ekstern innsetting
      summary: Sendes av serveren når en annen klient setter inn tekst.
      payload:
        $ref: '#/components/schemas/RemoteInsertPayload'
    RemoteDeleteMessage:
      messageId: remoteDelete
      name: RemoteDeleteMessage
      title: Ekstern sletting
      summary: Sendes av serveren når en annen klient sletter tekst.
      payload:
        $ref: '#/components/schemas/RemoteDeletePayload'
    RemoteCursorMessage:
      messageId: remoteCursor
      name: RemoteCursorMessage
      title: Ekstern markøroppdatering
      summary: Sendes av serveren når en annen klient flytter markøren sin.
      payload:
        $ref: '#/components/schemas/RemoteCursorPayload'
    PeerLeftMessage:
      messageId: peerLeft
      name: PeerLeftMessage
      title: Bruker forlot tilkoblingen
      summary: Sendes av serveren når en annen peer kobler fra.
      payload:
        $ref: '#/components/schemas/PeerLeftPayload'
    CounterStateMessage:
      messageId: counterState
      name: CounterStateMessage
      title: Tilstand for cookie-teller
      summary: Sendes av serveren for å rapportere total verdi og bekreftet bidrag for gjeldende peer.
      payload:
        $ref: '#/components/schemas/CounterStatePayload'
    ErrorMessage:
      messageId: error
      name: ErrorMessage
      title: Feil
      summary: Sendes av serveren når en melding er ugyldig eller ikke kan brukes.
      payload:
        $ref: '#/components/schemas/ErrorPayload'
  schemas:
    RgaId:
      type: object
      additionalProperties: false
      properties:
        peer_id:
          type: integer
          minimum: 0
        sequence:
          type: integer
          minimum: 0
      required:
        - peer_id
        - sequence
      examples:
        - peer_id: 4
          sequence: 17
    CookieCounterSnapshot:
      type: object
      additionalProperties: false
      properties:
        counts:
          type: object
          description: Cookie-antall per peer lagret av serveren som en GCounter.
          additionalProperties:
            type: integer
            minimum: 0
      required:
        - counts
      examples:
        - counts:
            '1': 8
            '2': 5
    RgaNode:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
          description: Tekstfragmentet som er lagret i denne CRDT-noden.
        id:
          $ref: '#/components/schemas/RgaId'
        parent_id:
          $ref: '#/components/schemas/RgaId'
        tombstoned:
          type: boolean
      required:
        - value
        - id
        - parent_id
        - tombstoned
    SyncRequestPayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: sync_request
      required:
        - type
      examples:
        - type: sync_request
    InsertPayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: insert
        value:
          type: string
          minLength: 1
          description: Innsatt tekstfragment. Frontenden sender i dag ett grafem per melding.
        char:
          type: string
          minLength: 1
          description: Kompatibilitetsfelt som speiler `value`.
        id:
          $ref: '#/components/schemas/RgaId'
        parent_id:
          $ref: '#/components/schemas/RgaId'
      required:
        - type
        - id
        - parent_id
      anyOf:
        - required: [value]
        - required: [char]
      examples:
        - type: insert
          value: h
          char: h
          id:
            peer_id: 2
            sequence: 11
          parent_id:
            peer_id: 0
            sequence: 0
    RemoteInsertPayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: remote_insert
        value:
          type: string
          minLength: 1
        char:
          type: string
          minLength: 1
        id:
          $ref: '#/components/schemas/RgaId'
        parent_id:
          $ref: '#/components/schemas/RgaId'
      required:
        - type
        - id
        - parent_id
      anyOf:
        - required: [value]
        - required: [char]
      examples:
        - type: remote_insert
          value: h
          char: h
          id:
            peer_id: 2
            sequence: 11
          parent_id:
            peer_id: 0
            sequence: 0
    DeletePayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: delete
        target_id:
          $ref: '#/components/schemas/RgaId'
      required:
        - type
        - target_id
      examples:
        - type: delete
          target_id:
            peer_id: 2
            sequence: 11
    RemoteDeletePayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: remote_delete
        target_id:
          $ref: '#/components/schemas/RgaId'
      required:
        - type
        - target_id
      examples:
        - type: remote_delete
          target_id:
            peer_id: 2
            sequence: 11
    CursorUpdatePayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: cursor_update
        anchor_id:
          anyOf:
            - $ref: '#/components/schemas/RgaId'
            - type: 'null'
        cursor_index:
          type: integer
          minimum: 0
      required:
        - type
        - anchor_id
        - cursor_index
      examples:
        - type: cursor_update
          anchor_id:
            peer_id: 2
            sequence: 11
          cursor_index: 4
    RemoteCursorPayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: remote_cursor
        peer_id:
          type: integer
          minimum: 1
        anchor_id:
          anyOf:
            - $ref: '#/components/schemas/RgaId'
            - type: 'null'
        cursor_index:
          type: integer
          minimum: 0
      required:
        - type
        - peer_id
        - anchor_id
        - cursor_index
      examples:
        - type: remote_cursor
          peer_id: 2
          anchor_id:
            peer_id: 2
            sequence: 11
          cursor_index: 4
    PeerLeftPayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: peer_left
        peer_id:
          type: integer
          minimum: 1
      required:
        - type
        - peer_id
      examples:
        - type: peer_left
          peer_id: 2
    CounterUpdatePayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: counter_update
        counter:
          type: string
          const: cookies
        count:
          type: integer
          minimum: 0
          description: Klientens siste lokale cookie-antall for denne peeren.
      required:
        - type
        - counter
        - count
      examples:
        - type: counter_update
          counter: cookies
          count: 9
    CounterStatePayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: counter_state
        counter:
          type: string
          const: cookies
        value:
          type: integer
          minimum: 0
          description: Total delt cookie-verdi.
        own_count:
          type: integer
          minimum: 0
          description: Serverbekreftet verdi som den tilkoblede peeren selv har bidratt med.
      required:
        - type
        - counter
        - value
        - own_count
      examples:
        - type: counter_state
          counter: cookies
          value: 13
          own_count: 8
    AssignPeerIdPayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: assign_peer_id
        peer_id:
          type: integer
          minimum: 1
      required:
        - type
        - peer_id
      examples:
        - type: assign_peer_id
          peer_id: 2
    SyncStatePayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: sync_state
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/RgaNode'
        visible_text:
          type: string
        cookie_counter:
          $ref: '#/components/schemas/CookieCounterSnapshot'
      required:
        - type
        - nodes
        - visible_text
        - cookie_counter
      examples:
        - type: sync_state
          nodes:
            - value: H
              id:
                peer_id: 1
                sequence: 1
              parent_id:
                peer_id: 0
                sequence: 0
              tombstoned: false
            - value: i
              id:
                peer_id: 1
                sequence: 2
              parent_id:
                peer_id: 1
                sequence: 1
              tombstoned: false
          visible_text: Hi
          cookie_counter:
            counts:
              '1': 8
              '2': 5
    ErrorPayload:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: error
        message:
          type: string
      required:
        - type
        - message
      examples:
        - type: error
          message: invalid json
