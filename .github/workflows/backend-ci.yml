name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'shared/**'
      - 'backend/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: [main, dev]
    paths:
      - 'shared/**'
      - 'backend/**'
      - 'CMakeLists.txt'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: .cmake-deps
          key: cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
